name: Release Trust

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-release-trust:
    name: Offline release trust
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.23.0"
          check-latest: false
      - name: Verify offline release-trust tests
        run: go test ./internal/releasetrust ./internal/cli -run 'TestRelease|TestCanonical|TestVerify|TestProvenance|TestVerifyArtifact' -count=1
      - name: Enforce offline release-trust boundary
        run: bash scripts/check-t9-release-trust.sh
