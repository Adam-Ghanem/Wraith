name: CI

on:
  push:
    branches:
      - main
      - phase-6-hardening-ci
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  go-quality:
    name: Go quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.23.0"
          check-latest: false
      - name: Verify module checksums
        run: go mod verify
      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || {
            echo "Go files are not formatted. Run: gofmt -w <files>" >&2
            gofmt -l . >&2
            exit 1
          }
      - name: Check whitespace errors
        run: git diff --check
      - name: Run go vet
        run: go vet ./...
      - name: Run unit tests
        run: go test ./...
      - name: Run bounded NPD parser fuzz smoke
        run: go test ./internal/npd -run=^$ -fuzz=FuzzParsePortsBounded -fuzztime=10s
      - name: Run bounded NPD target fuzz smoke
        run: go test ./internal/npd -run=^$ -fuzz=FuzzParseTCPTarget -fuzztime=10s
      - name: Run bounded NPD planning fuzz smoke
        run: go test ./internal/npd -run=^$ -fuzz=FuzzNPDPlanBounded -fuzztime=10s
      - name: Run NPD offline benchmarks
        run: go test ./internal/npd -run=^$ -bench='Benchmark(ParsePortsBounded|CanonicalPortOrdering|CanonicalTCPTarget|NPDPlanning)$' -benchmem -benchtime=1s
      - name: Run R12 CLI smoke and migration checks
        run: go test ./internal/cli -run TestR12LocalCommandSmokeAndAuthorizationMatrix -count=1 && go test ./internal/storage -run 'Migration|Restart|SchemaVersion' -count=1
      - name: Run race-detector tests
        run: go test -race ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          version: v1.61.0
          args: ./...
      - name: Build all Go packages
        run: go build ./...
      - name: Check dependency review coverage
        run: bash scripts/check-dependency-review.sh go
      - name: Check high-confidence secret markers
        run: bash scripts/check-secret-markers.sh
      - name: Check T4 trust enforcement boundary
        run: bash scripts/check-t4-trust-enforcement.sh
      - name: Check T5 central outbound gateway boundary
        run: bash scripts/check-t5-outbound-gateway.sh
      - name: Check T6 central egress adoption boundary
        run: bash scripts/check-t6-central-egress-adoption.sh
      - name: Check T7 data governance boundary
        run: bash scripts/check-t7-data-governance.sh
      - name: Check T8 data protection boundary
        run: bash scripts/check-t8-data-protection.sh

  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          check-latest: false
      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: "10.4.1"
      - name: Install locked dependencies
        run: pnpm --dir web install --frozen-lockfile --ignore-scripts
      - name: Check types
        run: pnpm --dir web check
      - name: Run frontend tests
        run: pnpm --dir web test
      - name: Build frontend
        run: pnpm --dir web build
      - name: Audit production dependencies
        run: pnpm --dir web audit --prod
      - name: Check dependency review coverage
        run: bash scripts/check-dependency-review.sh web
